[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-fusion"
version = "0.1.0"
description = "Riset metode fusion yang dibangun dengan agentic workflow bertahap (Fase 0-4)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.4",
    "torch>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
# Bangun fitur dataset penuh (scripts/build_full_features.py)
features = [
    "requests>=2.31",
    "sentence-transformers>=3.0",
    "transformers>=4.40",
]
# Laporan PDF + gambar (scripts/laporan_sementara.py)
report = [
    "matplotlib>=3.8",
    "reportlab>=4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]
# Notebook Fase 1 (referensi dari teman tim) tidak di-lint.
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY"]
